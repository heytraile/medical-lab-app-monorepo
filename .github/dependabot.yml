version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-patch-minor:
        patterns: ["*"]
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-patch-minor:
        patterns: ["*"]
        update-types:
          - patch
          - minor
